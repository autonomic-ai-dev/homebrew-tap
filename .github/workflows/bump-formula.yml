name: Bump formula versions

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release]
  schedule:
    # Hourly check for new agent-brain and agent-spine releases
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  bump:
    name: Update Homebrew formula versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update formulas
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/update-formulas.sh
          ./scripts/update-formulas.sh

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add Formula/
            git commit -m "chore: bump formulas to latest release digests"
            git push
          else
            echo "No formula changes needed."
          fi
